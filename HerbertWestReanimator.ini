name.English=Herbert West—Reanimator I: From the Dark
synopsys.English=A fresh grave in the potter's field. A deserted farmhouse beyond Meadow Hill. A solution that has never worked on a man.
description.English=Arkham, the summer of our third year at the Miskatonic University Medical School. Herbert West has been debarred from his experiments by Dean Halsey himself, but he will not stop: he needs a human subject, and it must be fresh.\n\nUnearth a drowned workman from the potter's field without being seen, carry him to the deserted Chapman farmhouse, and learn what West's solution can do. After H. P. Lovecraft.
authors.English=Thijs Hakkenberg, after H. P. Lovecraft (1922)
